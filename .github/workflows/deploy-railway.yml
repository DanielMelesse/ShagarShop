name: Deploy Railway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "**/*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add GitHub secret RAILWAY_TOKEN and connect the Railway GitHub integration"
            echo "for automatic deploys. Until then, deploy with: railway up"
            echo "See docs/production.md"
            exit 0
          fi
          curl -fsSL https://railway.com/install.sh | sh
          # install.sh puts the binary in ~/.railway/bin but does not update PATH in this shell
          export PATH="$HOME/.railway/bin:$PATH"
          railway up --ci
